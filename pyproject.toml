[project]
name = "autonomous-bug-fixer"
version = "0.1.0"
description = "Autonomous Bug Fixer Agent for Python/FastAPI codebases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gitpython>=3.1.59",
    "google-genai>=2.18.1",
    "groq>=1.6.0",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
